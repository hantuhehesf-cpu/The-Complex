name: Build mod

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '*.schem'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak ZIP
        run: |
          ZIP=$(ls *.zip | head -1)
          echo "Mengekstrak $ZIP"
          mkdir -p src_extract
          unzip -o "$ZIP" -d src_extract
          ls src_extract

      - name: Salin schematic ke dalam mod
        run: |
          DEST=src_extract/thecomplex/src/main/resources/data/thecomplex/schem
          mkdir -p "$DEST/rooms"
          shopt -s nullglob
          for f in *.schem; do
            n=$(echo "${f%.schem}" | tr 'A-Z' 'a-z' | tr -d ' _-')
            if [ "$n" = "mainchamber" ]; then
              cp "$f" "$DEST/main_chamber.schem"
            else
              cp "$f" "$DEST/rooms/"
            fi
          done
          find "$DEST" -type f

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.1.1

      - name: Compile
        working-directory: src_extract/thecomplex
        run: gradle build --no-daemon --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: thecomplex-jar
          path: src_extract/thecomplex/build/libs/*.jar
